<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>人脸识别</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="{{ url_for('index') }}" class="nav-back">← 返回主页</a>
            <span class="nav-title">人脸识别</span>
        </div>
        <div class="video-wrapper">
            <img src="{{ url_for('video_feed') }}" alt="实时视频流" />
        </div>
        <div class="status-bar">
            <span class="status-dot online"></span>
            <span>实时识别中...</span>
            <span style="margin-left: auto;">已注册: <span id="person-count">加载中...</span> 人</span>
        </div>
        <div class="info-tip">
            💡 绿色框 = 匹配成功，红色框 = 未知人员
        </div>
    </div>
    <script>
        fetch('/api/persons')
            .then(res => res.json())
            .then(data => {
                document.getElementById('person-count').textContent = data.persons.length;
            })
            .catch(() => {});
    </script>
</body>
</html>
